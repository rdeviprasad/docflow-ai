services:
  postgres:
    image: postgres:16-alpine
    container_name: docflow_postgres
    restart: always
    environment:
      POSTGRES_USER: docflow_user
      POSTGRES_PASSWORD: docflow_secret_password
      POSTGRES_DB: docflow_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: